<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用市场</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.6}
        header{position:fixed;top:0;left:0;right:0;background:#2c3e50;color:#fff;padding:1rem 2rem;z-index:1000;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 10px rgba(0,0,0,.1)}
        header .logo{font-size:1.5rem;font-weight:bold;display:flex;align-items:center;gap:.5rem}
        header .logo i{color:#3498db}
        .search-box{flex:1;max-width:400px;padding:.6rem 1rem;border:none;border-radius:25px;font-size:1rem}
        main{margin-top:120px;padding:2rem}
        .container{max-width:1200px;margin:0 auto}
        .filters{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
        .filters label{display:flex;align-items:center;gap:.3rem;cursor:pointer}
        .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem}
        .app-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:.3s}
        .app-card:hover{transform:translateY(-5px);box-shadow:0 5px 20px rgba(0,0,0,.15)}
        .app-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
        .app-icon{width:60px;height:60px;border-radius:12px;object-fit:cover}
        .app-name{font-size:1.1rem;font-weight:600}
        .app-developer{color:#7f8c8d;font-size:.9rem}
        .app-type{margin-left:.5rem;padding:.2rem .5rem;border-radius:4px;font-size:.75rem;color:#fff}
        .android{background:#a4c639}
        .windows{background:#00bcf2}
        .app-description{color:#555;font-size:.9rem;margin:1rem 0}
        .download-btn{width:100%;padding:.6rem;border:none;border-radius:6px;color:#fff;font-size:.9rem;cursor:pointer;transition:.3s}
        .download-btn.android{background:#27ae60}
        .download-btn.windows{background:#3498db}
        .download-btn:hover{filter:brightness(1.1)}
        .no-results{text-align:center;padding:4rem 2rem;color:#7f8c8d}
        footer{background:#2c3e50;color:#fff;text-align:center;padding:2rem;margin-top:4rem}
        @media(max-width:768px){header{flex-direction:column}.apps-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-store"></i> 应用市场</div>
    <input class="search-box" id="searchInput" placeholder="搜索应用名称" />
</header>

<main>
    <div class="container">
        <div class="filters">
            <label><input type="checkbox" id="filterAndroid" checked> Android</label>
            <label><input type="checkbox" id="filterWindows" checked> Windows</label>
        </div>

        <div class="apps-grid" id="appsGrid"></div>
        <div class="no-results" id="noResults" style="display:none">
            <i class="fas fa-search" style="font-size:3rem;opacity:.3"></i>
            <h3>未找到相关应用</h3>
        </div>
    </div>
</main>

<footer>
    © 2025 东神团队 | 应用市场
</footer>

<script>
    // 1. 只改这里：继续往数组里堆，多少条都显示
    const appsData = [
        {
            displayName: '东风Gi16浏览器',
            fileName: 'EaatWindGi16Browser.apk',
            developer: '东神团队',
            description: 'Android 专用浏览器，极速内核，简洁无广告。|〔软件版本：11.5.1〕|〔兼容系统：5.0.0~18.0.0〕',
            icon: '0000000001-logo.png',
            type: 'android'
        },
        {
            displayName: '东风Gi16浏览器',
            fileName: 'EaatWindGi16Browser.exe',
            developer: '东神团队',
            description: 'Windwws 专用浏览器，极速内核，简洁无广告。 |〔软件版本：11.5.1〕|〔兼容系统：Win7~Win13〕',
            icon: '0000000001-logo.png',
            type: 'windows'
        },
        {
            displayName: '应用市场',
            fileName: 'SoftWareMarket.apk',
            developer: '东神团队',
            description: 'Android 专用应用市场，极速内核，简洁无广告，点击一键下载并安装。 |〔软件版本：5.3.6〕|〔兼容系统：5.0.0~18.0.0〕',
            icon: '0000000002-logo.png',
            type: 'android'
        },
        {
            displayName: '应用市场',
            fileName: 'SoftWareMarket.exe',
            developer: '东神团队',
            description: 'Windwws 专用应用市场，极速内核，简洁无广告。 |〔软件版本：5.3.6〕|〔兼容系统：Win7~Win13〕',
            icon: '0000000002-logo.png',
            type: 'windows'
        },
        {
            displayName: '东阳',
            fileName: 'DongYangVideo.apk',
            developer: '东神团队',
            description: '仅限对安卓和IOS开放的短视频平台，简洁无广告。 |〔软件版本：5.2.7〕|〔兼容系统：5.0.0~18.0.0〕',
            icon: '0000000003-logo.png',
            type: 'android'
        }
        // ↑ 想加多少继续往下写即可
    ];

    const searchInput = document.getElementById('searchInput');
    const filterAndroid = document.getElementById('filterAndroid');
    const filterWindows = document.getElementById('filterWindows');
    const appsGrid = document.getElementById('appsGrid');
    const noResults = document.getElementById('noResults');

    function renderApps(list = appsData) {
        if (!list.length) return noResults.style.display = 'block';
        noResults.style.display = 'none';
        appsGrid.innerHTML = list.map(app => `
            <div class="app-card">
                <div class="app-header">
                    <img src="${app.icon}" alt="${app.displayName}" class="app-icon" onerror="this.src='https://via.placeholder.com/200?text=${app.displayName}'">
                    <div>
                        <div class="app-name">${app.displayName}<span class="app-type ${app.type}">${app.type.toUpperCase()}</span></div>
                        <div class="app-developer">${app.developer}</div>
                    </div>
                </div>
                <p class="app-description">${app.description}</p>
                <button class="download-btn ${app.type}" onclick="downloadFile('${app.fileName}')">
                    <i class="fab fa-${app.type}"></i> 下载 ${app.displayName}
                </button>
            </div>
        `).join('');
    }

    function downloadFile(fileName) {
        const link = document.createElement('a');
        link.href = 'https://dongshengamestudio.github.io/SoftWareLibray/' + fileName;
        link.download = fileName;
        link.click();
    }

    function filterApps() {
        const kw = searchInput.value.trim().toLowerCase();
        const and = filterAndroid.checked;
        const win = filterWindows.checked;
        const filtered = appsData.filter(app =>
            (and && app.type === 'android' || win && app.type === 'windows') &&
            (app.displayName.toLowerCase().includes(kw) || app.developer.toLowerCase().includes(kw))
        );
        renderApps(filtered);
    }

    searchInput.addEventListener('input', filterApps);
    filterAndroid.addEventListener('change', filterApps);
    filterWindows.addEventListener('change', filterApps);

    renderApps();
</script>

</body>
</html>
